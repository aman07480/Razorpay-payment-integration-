{% extends "product/base.html" %}

{% block content %}

<div class="max-w-6xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-center mb-6">All Products</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">

        {% for product in products %}
        <div class="bg-white shadow-lg rounded-2xl p-5 text-center hover:scale-105 transition">

            <h2 class="text-xl font-semibold mb-2">{{ product.name }}</h2>

            <p class="text-lg font-bold text-green-600 mb-4">
                ₹ {{ product.price }}
            </p>

            <a href="{% url 'Checkout' product.id %}">
                <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                    Buy Now
                </button>
            </a>

        </div>
        {% empty %}
            <p class="text-center col-span-3 text-gray-500">No products available</p>
        {% endfor %}

    </div>
</div>

{% endblock %}
