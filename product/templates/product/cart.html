{% extends "product/base.html" %}

{% block content %}

<div class="p-10">
    <h1 class="text-2xl font-bold mb-5">🛒 My Cart</h1>

    {% for item in cart_items %}
    <div class="bg-white p-4 mb-3 shadow rounded flex justify-between">

        <div>
            <h2>{{ item.product.name }}</h2>
            <p>₹ {{ item.product.price }} × {{ item.quantity }}</p>

            <!-- ✅ Quantity Buttons (NOW INSIDE LOOP) -->
            <div class="flex items-center gap-3 mt-2">

                <a href="{% url 'update_cart' item.id 'decrease' %}">
                    <button class="bg-gray-300 px-2">-</button>
                </a>

                <span>{{ item.quantity }}</span>

                <a href="{% url 'update_cart' item.id 'increase' %}">
                    <button class="bg-gray-300 px-2">+</button>
                </a>

            </div>
        </div>

        <div>
            <p class="font-bold">
                ₹ {{ item.product.price }} × {{ item.quantity }}
            </p>

            <a href="{% url 'remove_from_cart' item.id %}">
                <button class="bg-red-500 text-white px-3 py-1 mt-2 rounded">
                    Remove
                </button>
            </a>
        </div>

    </div>
    {% endfor %}

    <hr class="my-5">

    <h2 class="text-xl font-bold">
        Total: ₹ {{ total }}
    </h2>

</div>
<div class="mt-5 text-center">

    <a href="{% url 'cart_checkout' %}">
        <button class="bg-green-500 text-white px-6 py-2 rounded-lg">
            Proceed to Checkout 💳
        </button>
    </a>

</div>

{% endblock %}
